name: identity
description: "Shared identity, key derivation, and crypto primitives for Luci apps. Pure Dart — no Flutter, no storage."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.11.3

dependencies:
  # Crypto
  sodium: ^4.0.0            # libsodium bindings (X25519, XSalsa20-Poly1305, BLAKE2b, Ed25519)
  bip39: ^1.0.6             # BIP39 mnemonic encoding/decoding
  crypto: ^3.0.3            # SHA-256 for UID + store-binding derivation

dev_dependencies:
  test: ^1.25.0
  lints: ^6.0.0
